# Copy to <repo>/.github/workflows/install.yml with assets/install.sh and assets/install.ps1; replace PKG_DIR and CMD.
# Runs both installers on Linux, macOS and Windows against this commit (INSTALL_SOURCE), then runs the command once.
name: install
on:
  push:
    branches: [main]
    paths: [install.sh, install.ps1, pyproject.toml, uv.lock, "PKG_DIR/**", .github/workflows/install.yml]
  pull_request:
    paths: [install.sh, install.ps1, pyproject.toml, uv.lock, "PKG_DIR/**", .github/workflows/install.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      INSTALL_SOURCE: ${{ github.workspace }}  # install this commit, not what is on GitHub
      INSTALL_NO_LAUNCH: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os != 'Windows'
        run: |
          sh install.sh --no-launch
          ~/.local/bin/CMD --help
      - if: runner.os == 'Windows'
        shell: powershell  # Windows PowerShell 5.1, what the README one-liner runs
        run: |
          ./install.ps1
          $bin = Join-Path (uv tool dir --bin) "CMD.exe"
          & $bin --help; if ($LASTEXITCODE -ne 0) { exit 1 }
