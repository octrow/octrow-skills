<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">octrow-skills</title>
  <desc id="d">octrow-skills: agent skills for Claude Code and Claude Tag. Beside the title, the nine plugins in the marketplace.</desc>
  <style>
    .sans { font-family: "Ubuntu Sans", Ubuntu, "Segoe UI", -apple-system, BlinkMacSystemFont, "Noto Sans", sans-serif; }
    .mono { font-family: "Ubuntu Sans Mono", "Ubuntu Mono", "SF Mono", Consolas, "DejaVu Sans Mono", monospace; }
  </style>
  <rect width="1200" height="400" rx="16" fill="#f3f0e8"/>

  <!-- left: context, name, promise -->
  <text x="64" y="84" class="mono" font-size="22" fill="#6b6a64">plugin marketplace · Claude Code</text>
  <text x="60" y="176" class="sans" font-size="76" font-weight="700" fill="#15171b" letter-spacing="-2">octrow-skills</text>
  <text x="64" y="244" class="sans" font-size="34" fill="#15171b">Agent skills for Claude Code</text>
  <text x="64" y="288" class="sans" font-size="34" fill="#15171b">and Claude Tag.</text>
  <circle cx="72" cy="346" r="8" fill="#c2410c"/>
  <text x="96" y="354" class="mono" font-size="24" fill="#c2410c">9 plugins, one command each</text>

  <!-- right: the plugins in the marketplace -->
  <rect x="664" y="40" width="496" height="320" rx="14" fill="#15171b"/>
  <g class="mono" font-size="21">
    <text x="696" y="86" fill="#8f8d86">$ plugins @octrow-skills</text>
    <text x="696" y="124" fill="#f0a27a">repo-ready</text>
    <text x="696" y="151" fill="#f3f0e8">python-logging</text>
    <text x="696" y="178" fill="#f3f0e8">llm-call-audit</text>
    <text x="696" y="205" fill="#f3f0e8">logic-map</text>
    <text x="696" y="232" fill="#f3f0e8">qt-ui</text>
    <text x="696" y="259" fill="#f3f0e8">qt-app</text>
    <text x="696" y="286" fill="#f3f0e8">system-design</text>
    <text x="696" y="313" fill="#f3f0e8">lean-spec</text>
    <text x="696" y="340" fill="#f3f0e8">repo-scout</text>
  </g>
</svg>
